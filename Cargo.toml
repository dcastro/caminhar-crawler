[package]
name = "caminhar-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]

reqwest = { version = "0.13.2", "features" = ["json", "form"] }
tokio = { version = "1.49.0", features = ["rt", "macros", "rt-multi-thread"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", "features" = ["derive"] }
clap = { version = "4.5.57", features = ["derive"] }
itertools = "0.14.0"
bytes = "1.10.0"
http-body-util = "0.1.2"

async-trait = "0.1.89"
google-photoslibrary1 = "7.0.0+20251221"
rustls = "0.23.36"
